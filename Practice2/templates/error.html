{% extends "base.html" %}
{% block title %}{{ status_code }} · Bookmark{% endblock %}
{% block content %}

<div class="wrap">
  <section class="hero" style="text-align: center; padding: 64px 0;">
    <div class="eyebrow">Error {{ status_code }}</div>
    <h1>{{ title }}</h1>
    <p class="sub" style="margin-left: auto; margin-right: auto;">{{ detail }}</p>
    <a href="{{ url_for('home') }}" class="pill" style="margin-top: 24px; display: inline-block;">Back to the shelf</a>
  </section>
</div>

{% endblock %}
